<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" th:href="@{/products}">
                Quản Lý Bán Hàng
            </a>
            <nav aria-label="Điều hướng chính">
                <a th:href="@{/categories}">Danh mục</a>
                <a th:href="@{/products}">Sản phẩm</a>
                <a th:href="@{/}">Trang chủ</a>
            </nav>
        </div>
    </header>

    <main class="page page-form">
        <a class="back-link" th:href="@{/products}">
            ← Quay lại danh sách
        </a>

        <h1>Thêm sản phẩm mới</h1>
        <p class="muted">Nhập thông tin sản phẩm. Các mục có * là bắt buộc.</p>

        <p class="notice notice-error"
           th:if="${error}" th:text="${error}" role="alert"></p>

        <p class="notice notice-error"
           th:if="${#lists.isEmpty(categories)}">
            Chưa có danh mục.
            <a th:href="@{/categories/add}">Tạo danh mục trước</a>
            để thêm sản phẩm.
        </p>

        <form th:action="@{/products/add}"
              th:object="${product}"
              method="post">

            <label for="name">Tên sản phẩm *</label>
            <input type="text" id="name"
                   th:field="*{name}"
                   placeholder="Ví dụ: Điện thoại Samsung"
                   maxlength="255" required>

            <label for="price">Giá bán (VNĐ) *</label>
            <input type="number" id="price"
                   th:field="*{price}"
                   placeholder="Ví dụ: 5000000"
                   min="0" step="0.01" required>

            <label for="categoryId">Danh mục *</label>
            <select id="categoryId"
                    th:field="*{categoryId}" required>
                <option value="">-- Chọn danh mục --</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                </option>
            </select>

            <label for="description">Mô tả sản phẩm</label>
            <textarea id="description"
                      th:field="*{description}"
                      rows="4"
                      placeholder="Nhập đặc điểm, thông số sản phẩm..."></textarea>

            <label for="image">Đường dẫn ảnh</label>
            <input type="text" id="image"
                   th:field="*{image}"
                   placeholder="Nhập URL hoặc đường dẫn ảnh"
                   maxlength="255">

            <button type="submit"
                    th:disabled="${#lists.isEmpty(categories)}">
                Lưu sản phẩm
            </button>
            <a th:href="@{/products}">Hủy</a>
        </form>
    </main>
</body>
</html>
